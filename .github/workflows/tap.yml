name: cloud-tap
on:
  schedule:
    - cron: '*/4 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tap.py
        env:
          ABLY_KEY: ${{ secrets.ABLY_KEY }}
          NPOINT_CK: ${{ secrets.NPOINT_CK }}
